<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    
    <!-- Sphere Gradient -->
    <radialGradient id="sphereGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>

    <!-- Torus Gradient -->
    <linearGradient id="torusGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Decorative Grid Overlay -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.05">
    <path d="M 0,100 L 800,100 M 0,200 L 800,200 M 0,300 L 800,300 M 0,400 L 800,400 M 0,500 L 800,500" />
    <path d="M 100,0 L 100,600 M 200,0 L 200,600 M 300,0 L 300,600 M 400,0 L 400,600 M 500,0 L 500,600 M 600,0 L 600,600 M 700,0 L 700,600" />
  </g>

  <!-- Ambient Glow Background Lines -->
  <path d="M-100,300 Q 200,100 400,300 T 900,300" fill="none" stroke="#ec4899" stroke-width="4" opacity="0.2" filter="url(#glow)"/>
  <path d="M-100,350 Q 200,550 400,350 T 900,350" fill="none" stroke="#3b82f6" stroke-width="4" opacity="0.2" filter="url(#glow)"/>

  <!-- Abstract Vector Shapes (The Core Artwork) -->
  <g transform="translate(400, 300)">
    <!-- Rotating Ring Background -->
    <ellipse cx="0" cy="0" rx="220" ry="80" fill="none" stroke="url(#torusGrad)" stroke-width="12" stroke-dasharray="10 15" transform="rotate(-25)" opacity="0.7"/>
    
    <!-- Central Geometric Sphere -->
    <circle cx="0" cy="0" r="100" fill="url(#sphereGrad)" filter="url(#glow)" />
    
    <!-- Foreground Glassmorphic Ring -->
    <ellipse cx="0" cy="0" rx="220" ry="80" fill="none" stroke="url(#torusGrad)" stroke-width="12" transform="rotate(35)"/>
    
    <!-- Dynamic Orbiting Particles -->
    <circle cx="-180" cy="-60" r="8" fill="#f43f5e" filter="url(#glow)"/>
    <circle cx="150" cy="80" r="12" fill="#10b981" filter="url(#glow)"/>
    <circle cx="80" cy="-140" r="6" fill="#fbbf24" filter="url(#glow)"/>
  </g>

  <!-- Modern Typography Elements -->
  <text x="400" y="520" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="4">
    VECTOR ARTWORK
  </text>
  <text x="400" y="550" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" letter-spacing="2">
    SCALABLE VECTOR GRAPHIC (.SVG)
  </text>
</svg>
